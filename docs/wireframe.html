<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서AI 최종 와이어프레임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#1F2328;--muted:#5F6672;--line:#E3E5E8;--accent:#2458D6;--accent-soft:#EEF3FF;--bg:#F5F6F8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none;cursor:pointer}
b{font-weight:700}

/* ---------- 캔버스 ---------- */
#stage{position:fixed;inset:0;background:#E9EBEE radial-gradient(#C9CDD3 1px,transparent 1px) 0 0/24px 24px;cursor:grab;touch-action:none;user-select:none}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;padding:100px 120px 400px}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.lane{margin-top:180px}
.lane-h{display:flex;align-items:baseline;gap:20px;margin-bottom:40px;padding:18px 28px;background:#fff;border-radius:18px;box-shadow:0 0 0 1px rgba(0,0,0,.06);width:max-content}
.lane-h .no{font-size:44px;font-weight:700;color:var(--accent)}
.lane-h .tt{font-size:36px;font-weight:700;color:#2B3138}
.lane-h .dd{font-size:20px;color:var(--muted)}
.cols{display:flex;gap:190px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:90px;width:390px}
.blabel{font-size:16px;font-weight:700;margin-bottom:12px;color:#2B3138}
.board{width:390px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.12);position:relative;cursor:pointer}
.board.fx{height:844px}
.board:hover{box-shadow:0 0 0 3px var(--accent),0 12px 32px rgba(0,0,0,.16)}
.board.flash{box-shadow:0 0 0 8px #FFC94D,0 12px 32px rgba(0,0,0,.16)}
.memo{margin-top:16px;background:#FFF8E1;border:1px solid #F0DE9E;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.6;color:#3A3F46;display:flex;flex-direction:column;gap:3px}
.memo div{display:flex;gap:8px}
.memo div>i{font-style:normal;flex:none;width:74px;color:#8A6D00;font-weight:700}
.memo .deal{color:#8A4B00}
.memo .poc{color:#B42318}

/* 안내 영역 */
#intro{display:grid;grid-template-columns:760px 760px 760px;gap:40px;align-items:start}
.panel{background:#fff;border-radius:22px;padding:28px 30px;box-shadow:0 0 0 1px rgba(0,0,0,.06);font-size:16px;line-height:1.7}
.panel h2{margin:0 0 14px;font-size:24px}
.panel h1{margin:0 0 6px;font-size:40px}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:4px 0}
.fchip{display:inline-flex;align-items:center;height:30px;padding:0 10px;margin:3px 4px 3px 0;border-radius:8px;background:#F1F3F6;font-size:13px;cursor:pointer}
.fchip:hover{background:var(--accent-soft);color:#1A43A8}
.play{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;border-radius:12px;background:var(--accent-soft);color:#1A43A8;font-weight:700;cursor:pointer}
.play small{font-weight:400;color:#3A3F46}
.crit{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #EEF0F3}
.crit .n{width:26px;height:26px;border-radius:50%;background:#E7F6EE;color:#13734A;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.leg{display:flex;align-items:center;gap:10px;margin:6px 0}
.leg i{display:inline-block;width:40px;border-top:3px solid #2458D6}
.leg i.e{border-top:3px dashed #8A9099}
.leg i.c{border-top:3px dashed #7F77DD}

/* 툴바 */
.toolbar{position:fixed;right:16px;bottom:16px;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #D3D9E0;border-radius:10px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:20}
.toolbar button{min-width:36px;height:34px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:14px;cursor:pointer;padding:0 10px}
.toolbar button:hover{background:#EEF1F4}
.toolbar .zoom{min-width:52px;text-align:center;font-size:13px;color:var(--muted)}
.hint{position:fixed;left:16px;bottom:16px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.9);border-radius:8px;padding:7px 11px;z-index:20}

/* ---------- 폰 화면 공통 ---------- */
.scr{width:390px;min-height:844px;background:var(--bg);display:flex;flex-direction:column;position:relative;font-size:14px;line-height:1.5}
.board.fx .scr,.ov .scr{height:844px;overflow:hidden}
.hd-w{position:sticky;top:0;z-index:4;background:#fff}
.sb{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700}
.hd{height:54px;display:flex;align-items:center;gap:4px;padding:0 12px 0 6px;border-bottom:1px solid #EEF0F3}
.hb,.hi{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.hi{color:var(--muted)}
.logo{font-size:19px;font-weight:700;padding-left:10px}
.ht{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-chip{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 6px;border-radius:999px;background:var(--accent-soft);color:#1A43A8;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.bd{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.ft{position:sticky;bottom:0;z-index:4;padding:12px 16px 18px;background:#fff;border-top:1px solid #EEF0F3;display:flex;gap:8px}
.tb{position:sticky;bottom:0;z-index:4;height:66px;display:flex;background:#fff;border-top:1px solid var(--line)}
.tb a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#8A9099}
.tb a.on{color:var(--accent);font-weight:700}
.card{background:#fff;border:1px solid #E8EAED;border-radius:16px;padding:16px;display:block}
.h2{font-size:16px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.more{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.btn{min-height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700;flex:1;text-align:center;padding:0 10px}
.btn.p{background:var(--accent);color:#fff}
.btn.l{background:#fff;border:1px solid #D5D9DE}
.btn.g{background:#F1F3F6}
.btn.off{background:#E9EBEE;color:#A0A6AE}
.stp a{cursor:pointer}
.btn.s{min-height:38px;font-size:13px;flex:none;padding:0 14px;border-radius:10px}
.tag{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:middle}
.t-red{background:#FDECEA;color:#B42318}.t-amb{background:#FFF3E0;color:#8A4B00}.t-grn{background:#E7F6EE;color:#13734A}
.t-blu{background:var(--accent-soft);color:#1A43A8}.t-gry{background:#F1F3F6;color:var(--muted)}.t-ink{background:#1F2328;color:#fff}
.mut{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #EEF0F3}
.li:last-child{border-bottom:0}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.say{display:flex;gap:10px;align-items:flex-start}
.say .bub{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px}
.note{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.warnb{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#FFF3E0;color:#6B3A00;font-size:13px}
.okb{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#E7F6EE;color:#13734A;font-size:13px;font-weight:700}
.infob{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:#1A43A8;font-size:13px}
.seg{display:flex;background:#E9EBEE;border-radius:10px;padding:3px}
.seg a{flex:1;height:34px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg a.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.srch{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#8A9099}

/* 단계 표시 */
.stp{display:flex;align-items:center;gap:6px;padding:10px 16px 12px;font-size:11px;color:#8A9099}
.stp .sd{width:22px;height:22px;border-radius:50%;background:#E3E5E8;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.stp .sd.done,.stp .sd.cur{background:var(--accent);color:#fff}
.stp .sd.cur{box-shadow:0 0 0 4px #DCE6FB}
.stp i{flex:1;height:2px;background:#E3E5E8}
.stp .sl.cur{color:var(--accent);font-weight:700}

/* 홈 */
.hero{display:flex;gap:10px}
.hbtn{flex:1;background:var(--accent);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.hbtn.w{background:#fff;color:var(--ink);border:1px solid var(--line)}
.hbtn small{font-size:12px;opacity:.85}
.ev{display:flex;align-items:center;gap:12px;padding:9px 0}
.dday{width:50px;height:32px;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ev>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.ev small{font-size:12px;color:var(--muted)}
.lane2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.lane2>b{width:22px;font-size:13px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 16px}

/* 문서 선택 */
.pop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pop a{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.sec-h{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 0}

/* 촬영 */
.opt{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.opt .oi{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.cam{width:390px;height:844px;background:#111;color:#fff;display:flex;flex-direction:column}
.cam .frame{flex:1;margin:20px 28px;border:2px solid rgba(255,255,255,.85);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#ddd;text-align:center;position:relative}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #111}

/* 페이지·가리기 */
.pages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pth{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pimg{height:150px;border-radius:8px;background:#F7F8FA;border:1px solid #EEF0F3;padding:12px 10px;display:flex;flex-direction:column;gap:7px}
.pimg.blur{filter:blur(1.2px)}
.ln{height:6px;border-radius:3px;background:#D5D9DE}
.ln.mk{background:#1F2328;height:8px}
.pth .pa{display:flex;gap:6px}
.pth .pa a{flex:1;height:32px;border-radius:8px;background:#F1F3F6;display:flex;align-items:center;justify-content:center;font-size:12px}
.addp{border:1.5px dashed #C5CAD1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;min-height:200px}
.paper{background:#fff;border:1px solid #DDE1E6;border-radius:10px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.paper .pt{font-size:14px;font-weight:700;text-align:center;margin-bottom:8px;display:flex;justify-content:center;gap:6px;align-items:center}
.prow{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #F0F1F3;font-size:13px}
.prow:last-child{border-bottom:0}
.prow>span:first-child{width:92px;color:var(--muted);flex:none}
.mkb{display:inline-block;height:16px;border-radius:3px;background:#1F2328}
.sel{border:2px dashed var(--accent);padding:2px 5px;border-radius:4px;position:relative;background:rgba(36,88,214,.06)}
.sel:before,.sel:after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.sel:before{left:-6px;top:-6px}.sel:after{right:-6px;bottom:-6px}
.tools{display:flex;gap:8px}
.tool{flex:1;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700}
.tool.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 분석 */
.pst{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px}
.pst .pd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#E3E5E8;color:#fff}
.pst.done .pd{background:var(--accent)}
.pst.doing .pd{background:#fff;border:3px solid var(--accent);border-right-color:#DCE6FB}
.pst.todo{color:#8A9099}

/* 결과 */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cv{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.cv small{font-size:12px;color:var(--muted)}
.cv b{font-size:15px}
.cv.miss b,.cv.unk b{font-size:13px;color:#8A4B00}
.iss{display:flex;flex-direction:column;gap:8px}
.iss .it{font-size:16px;font-weight:700}
.cmp{display:flex;align-items:center;gap:8px}
.cmp>div{flex:1;background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.cmp small{font-size:11px;color:var(--muted)}
.law{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.more2{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 10px;border-radius:8px;background:#F1F3F6;font-size:12.5px;font-weight:700}
.cnt{display:flex;gap:6px;flex-wrap:wrap}
.quote{padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13px;display:flex;gap:8px;justify-content:space-between;align-items:center}
.disc{font-size:12px;color:var(--muted);padding:4px 2px}

/* 조항 */
.orig{background:#FFFBEA;border:1px solid #F3E2A9;border-radius:12px;padding:12px 14px;font-size:14px}
.orig mark{background:#FFE58A;padding:0 2px}
.minipage{width:70px;height:92px;border:1px solid #DDE1E6;border-radius:6px;background:#fff;padding:8px 6px;display:flex;flex-direction:column;gap:5px;flex:none}
.minipage .ln{height:4px}
.minipage .hl{background:#FFC94D}
.src{color:#2458D6;font-weight:700;text-decoration:underline;margin-left:auto;cursor:pointer;white-space:nowrap}
.srcbox{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.srcbox>span{flex:1}
.warnline{margin-top:8px;font-size:12px;color:#8A4B00;background:#FFF8E1;border-radius:8px;padding:6px 8px;display:flex;gap:4px;align-items:flex-start}
.fold{position:absolute;left:0;right:0;border-top:2px dashed #E5484D;z-index:9;pointer-events:none}
.fold span{position:absolute;right:8px;top:-22px;background:#E5484D;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.lawbox{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px}

/* 비교 */
.vcard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.vbadge{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.chg{background:#fff;border:1px solid #E8EAED;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chg .bf,.chg .af{border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.chg .bf{background:#F5F6F8;color:var(--muted)}
.chg .af{background:var(--accent-soft);color:#12306F}
.chg small{font-size:11px}

/* 일정 */
.srow{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #EEF0F3}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #C5CAD1;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dt2{font-size:15px;font-weight:700}
.crow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid #EEF0F3}
.crow .ba{display:flex;align-items:center;gap:8px;font-size:14px}
.crow s{color:#8A9099}
.er{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #EEF0F3}
.ed{width:44px;flex:none;text-align:center;display:flex;flex-direction:column}
.ed b{font-size:18px}
.ed small{font-size:11px;color:var(--muted)}
.mh{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.calg span{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px}
.calg .w{height:26px;font-size:11px;color:#8A9099}
.calg .today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:700}
.calg .pick{background:var(--accent);color:#fff;font-weight:700}
.calg i{width:5px;height:5px;border-radius:50%;background:#E5484D}
.calg .pick i{background:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#1F2328;color:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:13px;z-index:6}

/* 내 계약서 */
.dc{display:flex;gap:12px;align-items:center}
.th{width:46px;height:58px;border-radius:8px;background:#EEF0F3;border:1px dashed #C5CAD1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}

/* 겹침(패널·확인창) */
.ov{position:relative;height:844px;overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(17,20,24,.48);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;height:88%;background:#F7F8FA;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;z-index:8}
.sheet.s60{height:62%}
.sheet.top2{z-index:8}
.dlg{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);background:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;z-index:10}
.dim.d2{z-index:9}
.dt{font-size:17px;font-weight:700;text-align:center}
.dd{font-size:14px;color:var(--muted);text-align:center}
.db{display:flex;gap:8px;margin-top:6px}

/* 챗봇 패널 */
.grab{width:40px;height:4px;border-radius:2px;background:#D5D9DE;margin:8px auto 2px}
.sh-t{display:flex;align-items:center;gap:8px;padding:4px 14px 8px 16px;font-size:16px}
.sh-t .x{margin-left:auto;color:var(--muted);width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.cl{margin:0 16px;display:flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:10px;background:#EDEFF2;color:var(--muted);font-size:12.5px}
.cl.on{background:var(--accent-soft);color:#1A43A8}
.cl .sw{margin-left:auto;font-weight:700;text-decoration:underline}
.ctx{margin:6px 16px 0;font-size:12px;color:#7A818B;display:flex;gap:4px;align-items:flex-start}
.banner{margin:8px 16px 0;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#E7F6EE;color:#13734A;font-size:13px;font-weight:700}
.banner a{margin-left:auto;height:30px;padding:0 10px;border-radius:8px;background:#13734A;color:#fff;display:flex;align-items:center}
.msgs{flex:1;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.me{align-self:flex-end;max-width:78%;background:var(--accent);color:#fff;padding:10px 13px;border-radius:16px 16px 4px 16px;font-size:14px}
.air{display:flex;gap:8px;align-items:flex-start}
.aib{background:#fff;border:1px solid #E8EAED;border-radius:4px 16px 16px 16px;padding:11px 13px;font-size:14px;max-width:88%}
.aib.fail{background:#FFF6F5;border-color:#F5C9C4}
.refs{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;color:#8A9099}
.refs em{font-style:normal;background:#F1F3F6;color:#3A3F46;border-radius:6px;padding:1px 7px}
.acts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.act{display:flex;justify-content:space-between;align-items:center;min-height:38px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:#1A43A8;font-size:13px;font-weight:700}
.qcs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.qc{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;border:1px solid #C9D6F5;background:#fff;color:#1A43A8;font-size:12.5px;white-space:nowrap}
.inp{margin:0 16px 16px;height:48px;border-radius:24px;background:#fff;border:1px solid #D5D9DE;display:flex;align-items:center;padding:0 6px 0 16px;color:#8A9099;font-size:14px;flex:none}
.inp span{flex:1}.inp .typed{color:var(--ink)}
.inp b{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}

/* 스플래시 */
.spl{width:390px;height:844px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.spl b{font-size:30px}
.dots{display:flex;gap:6px;margin-top:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:#DCE6FB}
.dots i:first-child{background:var(--accent)}

/* ---------- 미리보기(클릭 시연) ---------- */
#viewer{position:fixed;inset:0;z-index:50;display:none;background:rgba(20,24,30,.76);align-items:center;justify-content:center;gap:28px;padding:20px}
#viewer.on{display:flex}
.vhold{position:relative;overflow:hidden;border-radius:36px;box-shadow:0 0 0 9px #0E1013,0 20px 60px rgba(0,0,0,.5);flex:none;background:#fff}
#vphone{width:390px;height:844px;overflow-y:auto;overflow-x:hidden;transform-origin:0 0;background:#fff}
#vphone .board{box-shadow:none;border-radius:0;cursor:default}
.vside{width:360px;max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:18px 20px;font-size:13.5px;line-height:1.6}
.vside h3{margin:0 0 4px;font-size:17px}
.vside .vnav{display:flex;gap:6px;margin:12px 0}
.vside button{flex:1;height:38px;border:1px solid #D5D9DE;border-radius:10px;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.vside button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.vsteps{margin:8px 0;padding:0;list-style:none}
.vsteps li{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
.vsteps li.on{background:var(--accent-soft);color:#1A43A8;font-weight:700}
.vmsg{min-height:20px;font-size:12.5px;color:#1A43A8}
.vtoast{position:absolute;left:14px;right:14px;bottom:24px;background:#1F2328;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;z-index:60}
</style>
</head>
<body>

<!-- 캐릭터(말풍선 종이) 표정 9종: 화면 상태를 보여주는 장식이며 기능을 뜻하지 않는다 -->

  <button id="zoomOut" title="축소">−</button><span class="zoom" id="zoomText">50%</span><button id="zoomIn" title="확대">+</button>

<script>
// ============================================================
// 1. 작은 부품: 아이콘, 캐릭터, 이동 연결
// ============================================================
const ICON_PATHS = {
  back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="M9 5l7 7-7 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
  filePlus:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/>',
  files:'<path d="M8 3h8l4 4v12H8z"/><path d="M4 7v14h12"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  upload:'<path d="M12 16V5M7 10l5-5 5 5"/><path d="M5 19h14"/>',
  warn:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>', check:'<path d="M5 12l5 5 9-10"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.5M4 12h.5M4 18h.5"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  move:'<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>',
  send:'<path d="M4 12l16-8-6 16-2-7z"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  doc:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  swap:'<path d="M7 7h13l-4-4M17 17H4l4 4"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',
  info:'<circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8v.5"/>', refresh:'<path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 5v6h-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', image:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/>',
};
const icon = (name, size = 20) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${ICON_PATHS[name]}</svg>`;
const mascot = (expression, size = 40) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 80 80" style="flex:none" aria-hidden="true"><use href="#m${expression}"/></svg>`;

// data-go: 누르면 이동할 보드. data-arrow: 캔버스에 화살표로 그릴지 (m 기본 흐름 / e 예외·되돌아감 / c 챗봇)
const go = (target, arrow, label) =>
  target ? ` data-go="${target}"${arrow ? ` data-arrow="${arrow}"` : ''}${label ? ` data-label="${label}"` : ''}` : '';

// data-act: 다른 화면으로 가지 않고 이 화면 안에서 일어나는 일 (미리보기에서 누르면 설명으로 보여준다)
const act = description => ` data-act="${description}"`;
const button = (text, target, kind = 'p', arrow, inPlaceAction) => `<a class="btn ${kind}"${go(target, arrow)}${inPlaceAction ? act(inPlaceAction) : ''}>${text}</a>`;
const tag = (text, color = 'gry', iconName) => `<span class="tag t-${color}">${iconName ? icon(iconName, 12) : ''}${text}</span>`;
const say = (expression, text, size = 44) => `<div class="say">${mascot(expression, size)}<div class="bub">${text}</div></div>`;
const footer = (...buttons) => `<div class="ft">${buttons.join('')}</div>`;
const screen = (head, body, foot = '') => `<div class="scr">${head}<div class="bd">${body}</div>${foot}</div>`;

const AI_CHAT_HOME = 'S10_챗봇_처음열기_일반';
function header(title, options = {}) {
  const left = options.home
    ? '<b class="logo">문서AI</b><span class="ht"></span>'
    : `${options.back === false ? '<span style="width:10px"></span>' : `<a class="hb"${go(options.back, options.backArrow)}>${icon('back', 22)}</a>`}<span class="ht">${title}</span>`;
  return `<div class="hd-w"><div class="sb"><span>9:41</span><span>●●● ▮</span></div><div class="hd">${left}`
    + `<a class="hi"${go('P01_알림패널')}>${icon('bell', 22)}</a>`
    + `<a class="ai-chip"${go(options.ai || AI_CHAT_HOME, options.aiArrow)}>${mascot(1, 22)}AI에게 질문</a></div>${options.sub || ''}</div>`;
}

const TABS = [['home', '홈', 'S01_홈_기본'], ['filePlus', '계약서 등록', 'S02_문서선택_기본'], ['files', '내 계약서', 'S15_내계약서_목록'], ['cal', '내 일정', 'S14_내일정_목록']];
const tabBar = active => `<div class="tb">${TABS.map(([i, t, id]) => `<a class="${t === active ? 'on' : ''}"${go(id)}>${icon(i, 22)}${t}</a>`).join('')}</div>`;

// 등록 4단계. 끝낸 단계(앞 단계든, 갔다가 돌아온 뒷 단계든)는 눌러서 바로 갈 수 있다
const STEP_LABELS = ['종류', '올리기', '가리기', '확인'];
const STEP_SCREENS = ['S02_문서선택_기본', 'S04_미리보기_정상', 'S05_가리기_가림추가', 'S06_최종확인_정상'];
function progressSteps(current, finishedAhead = []) {
  return `<div class="stp">${STEP_LABELS.map((label, i) => {
    const n = i + 1, finished = n < current || finishedAhead.includes(n), isCurrent = n === current;
    const link = finished && !isCurrent ? go(STEP_SCREENS[i]) : (isCurrent ? '' : act('아직 끝내지 않은 단계라 누를 수 없어요.'));
    return `<a class="sd ${isCurrent ? 'cur' : finished ? 'done' : ''}"${link}>${finished && !isCurrent ? icon('check', 12) : n}</a><a class="sl ${isCurrent ? 'cur' : ''}"${link}>${label}</a>${n < 4 ? '<i></i>' : ''}`;
  }).join('')}</div>`;
}
// 등록 단계 화면의 아래 버튼: 왼쪽 = 이전 단계, 오른쪽 = 다음 단계 (아직 못 넘어가면 회색)
function stepFooter(current, next) {
  const previous = button(`‹ 이전: ${STEP_LABELS[current - 2]}`, next.previousTarget || STEP_SCREENS[current - 2], 'l', next.previousArrow);
  const nextButton = next.ready === false
    ? `<a class="btn off"${act(next.notReadyReason)}>${next.label} ›</a>`
    : button(`${next.label} ›`, next.target, 'p', next.arrow);
  return footer(previous, nextButton);
}

// 겹쳐 보이는 화면: 아래 화면은 흐리게 두고 패널·확인창을 위에 얹는다
const layered = (base, ...layers) =>
  `<div class="ov"><div class="base">${base}</div>${layers.map((layer, i) => `<div class="dim ${i ? 'd2' : ''}"></div>${layer}`).join('')}</div>`;
const sheet = (inner, small) => `<div class="sheet ${small ? 's60' : ''}">${inner}</div>`;
const dialog = ({ face, title, text, extra = '', buttons }) =>
  `<div class="dlg">${face ? `<div style="display:flex;justify-content:center">${mascot(face, 64)}</div>` : ''}<div class="dt">${title}</div><div class="dd">${text}</div>${extra}<div class="db">${buttons.join('')}</div></div>`;

// ============================================================
// 2. S10 챗봇 패널
// ============================================================
function chatPanel({ close, linkedDoc, linkNote, context, banner, messages, chips = [], input }) {
  const link = linkedDoc
    ? `<div class="cl on">${icon('doc', 15)}<span>내 문서 · <b>${linkedDoc}</b></span>${linkNote || ''}</div>`
    : `<div class="cl">${icon('info', 15)}<span>일반 질문 · 계약서 연결 없음</span></div>`;
  const renderMessage = m => {
    if (m.me) return `<div class="me">${m.me}</div>`;
    // 법령을 참고한 답변에는 원문 링크와 AI 실수 안내를 함께 붙인다
    const lawSource = m.refs?.includes('법령 DB')
      ? `<div class="refs"><span class="src"${act('국가법령정보센터(law.go.kr)에서 답변에 쓴 조문 원문이 열려요 (앱 밖).')}>법령 원문 ↗</span><span>AI도 실수할 수 있어요. 원문을 함께 확인해 주세요.</span></div>` : '';
    const refs = m.refs ? `<div class="refs"><span>참고한 정보</span>${m.refs.map(r => `<em>${r}</em>`).join('')}</div>${lawSource}` : '';
    const acts = m.acts ? `<div class="acts">${m.acts.map(([t, id, ar]) => `<a class="act"${go(id, ar, t)}>${t}${icon('chev', 14)}</a>`).join('')}</div>` : '';
    return `<div class="air">${mascot(m.face || 1, 30)}<div class="aib ${m.fail ? 'fail' : ''}">${m.ai}${refs}${acts}</div></div>`;
  };
  return sheet(`<div class="grab"></div><div class="sh-t">${mascot(1, 30)}<b>AI에게 질문</b><a class="x"${go(close)}>${icon('x', 22)}</a></div>`
    + link + `<div class="ctx">${icon('info', 13)}<span>${context}</span></div>` + (banner || '')
    + `<div class="msgs">${messages.map(renderMessage).join('')}</div>`
    + `<div class="qcs">${chips.map(c => Array.isArray(c) ? `<a class="qc"${go(c[1], c[2], c[0])}>${c[0]}</a>` : `<span class="qc"${act('이 질문을 바로 보내요.')}>${c}</span>`).join('')}</div>`
    + `<div class="inp"${act('질문을 직접 입력해 보내요. 계약서가 없어도 돼요.')}><span class="${input ? 'typed' : ''}">${input || '궁금한 걸 물어보세요'}</span><b>${icon('send', 18)}</b></div>`);
}

const maskBar = width => `<span class="mkb" style="width:${width}px"></span>`;
const paperRow = (label, value) => `<div class="prow"><span>${label}</span><span>${value}</span></div>`;

// state: select(끌어서 영역 지정 중) / added(방금 가림) / undone(되돌림) / zoom(이동·확대) / page2(가릴 정보 없는 쪽) / returned(확인 단계에서 고치러 돌아옴)

  const contact = {
    select: `<a class="sel"${go('S05_가리기_가림추가', 'm', '손을 떼면 가려짐')}>010-0000-0000</a>`,
    added: `<span style="outline:3px solid #FFC94D;border-radius:4px;display:inline-flex">${maskBar(110)}</span>`,
    returned: maskBar(110),
  }[state] || '010-0000-0000';

  const paper = state === 'page2'
    ? `<div class="paper"><div class="pt">특약 사항 ${tag('예시', 'gry')}</div>${paperRow('제7조', '1년 이내 퇴사 시 교육비 30만 원을 반환한다.')}${paperRow('제8조', '근무 시간 변경은 1주 전에 알린다.')}${paperRow('작성일', '2026.11.10')}</div>`

      ? `<div style="height:300px;overflow:hidden;border-radius:10px;border:1px solid #DDE1E6;background:#fff"><div style="transform:scale(1.6);transform-origin:0 46%">${page1Paper}</div></div>`

    page2: say(1, '이 쪽에 이름·번호처럼 <b>나를 알아볼 수 있는 정보가 없다면</b> 가리지 않고 넘어가도 돼요.', 40),
    zoom: say(4, '두 손가락으로 벌려 <b>확대</b>하고, 한 손가락으로 끌어 <b>옮겨</b> 보세요. 목록의 <b>보기</b>를 누르면 그 위치(주소)로 확대돼요.', 40),
    added: say(6, '<b>연락처</b>를 가렸어요. 가린 칸은 노란 테두리로 잠깐 표시돼요.', 40),
    undone: say(1, '마지막으로 가린 <b>연락처</b>를 되돌렸어요. 다시 끌어서 가릴 수 있어요.', 40),
    returned: say(1, '확인 단계에서 돌아왔어요. 가린 곳을 고친 뒤 <b>다시 확인</b>을 받아요. 위의 <b>4 확인</b>을 눌러도 바로 갈 수 있어요.', 40),
  }[state] || say(7, '가릴 곳을 손가락으로 <b>끌어서</b> 지정하고, 손을 떼면 가려져요. (파란 점선 = 지정 중)', 40);
  const maskedCount = state === 'added' || state === 'returned' ? 5 : 4;
  const tools = `<div class="tools">`
    + `<a class="tool ${state === 'zoom' ? '' : 'on'}"${state === 'zoom' ? go('S05_가리기_직접가리기', 'e', '가리기로') : act('가리기 모드예요. 끌어서 가릴 영역을 정해요.')}>${icon('edit', 18)}가리기</a>`
    + `<a class="tool ${state === 'zoom' ? 'on' : ''}"${state === 'zoom' ? act('이동·확대 모드예요. 가리기 없이 화면만 움직여요.') : go('S05_가리기_확대', state === 'select' ? 'e' : '', '이동·확대')}>${icon('move', 18)}이동·확대</a>`
    + `<a class="tool"${state === 'added' ? go('S05_가리기_되돌림', 'e', '되돌리기') : act('마지막으로 가린 곳부터 하나씩 취소해요.')}>${icon('undo', 18)}되돌리기</a></div>`;
  const page2 = state === 'page2';
  return screen(header('개인정보 가리기', { back: 'S04_미리보기_정상', ai: 'S10_챗봇_가리기중', aiArrow: state === 'select' ? 'c' : '', sub: progressSteps(3, state === 'returned' ? [4] : []) }),
    guide + paper
    + `<div class="note">${icon('info', 14)} 금액·날짜·근무 장소는 남겨 두세요. 가린 곳은 분석하지 않아요.</div>`

function maskedListSheet(removedAddress) {
  const item = (label, isAddress) => `<div class="li"><span class="tag t-ink">1쪽</span><span style="flex:1">${label}</span>`
    + `<a class="chip"${go('S05_가리기_확대', isAddress && !removedAddress ? 'e' : '', '보기')}>보기</a>`
    + `<a class="chip"${isAddress && !removedAddress ? go('S05_가리기_가린곳지움', 'e', '지우기') : act('이 가림을 지워요. 지운 곳은 보이는 채로 AI에 보내져요.')}>지우기</a></div>`;
  const items = item('사업주 이름') + item('근로자 이름') + item('주민등록번호') + (removedAddress ? '' : item('주소', true));
  const warning = removedAddress
    ? `<div class="warnb" style="margin:8px 16px 0">${icon('warn', 18)}<span style="flex:1"><b>주소 가림을 지웠어요</b><br>지금은 주소가 보이는 채로 AI에 보내져요.</span><a class="btn l s"${go('S05_가리기_가린곳목록', 'e', '되돌리기')}>되돌리기</a></div>`
    : '';
  return sheet(`<div class="grab"></div><div class="sh-t"><b>가린 곳 ${removedAddress ? 3 : 4}개</b><a class="x"${go('S05_가리기_직접가리기')}>${icon('x', 22)}</a></div>`
    + warning + `<div style="padding:0 16px">${items}</div>`
    + `<div style="padding:12px 16px" class="note">${icon('info', 14)} 내가 직접 가린 곳이에요. 앱이 자동으로 찾은 것이 아니에요. 보기 = 그 위치로 확대 · 지우기 = 가림 해제</div>`, true);
}

// ============================================================
// 6. 화살표: data-arrow가 붙은 버튼에서 목적지 보드로
// ============================================================
const WIRE_COLOR = { m: '#2458D6', e: '#8A9099', c: '#7F77DD' };
const WIRE_MARKER = { m: 'aM', e: 'aE', c: 'aC' };
let scale = 0.32, panX = 40, panY = 40;
const world = document.getElementById('world');

function rectInWorld(el) {
  const r = el.getBoundingClientRect(), w = world.getBoundingClientRect();
  const x = (r.left - w.left) / scale, y = (r.top - w.top) / scale;
  return { left: x, top: y, right: x + r.width / scale, bottom: y + r.height / scale, cx: x + r.width / scale / 2, cy: y + r.height / scale / 2 };
}
function curvePath(from, to, horizontal) {
  const [x1, y1] = from, [x2, y2] = to;
  if (horizontal) {
    const dx = Math.max(80, Math.abs(x2 - x1) / 2) * (x2 >= x1 ? 1 : -1);
    return [`M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`, (x1 + x2) / 2, (y1 + y2) / 2];
  }
  const dy = Math.max(60, Math.abs(y2 - y1) / 2);
  return [`M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`, (x1 + x2) / 2, (y1 + y2) / 2];
}
// 한 화면(844px)보다 긴 보드에 첫 화면이 끝나는 선을 긋는다. 그 아래는 스크롤해야 보인다
function markScrollFold() {
  document.querySelectorAll('#lanes .board:not(.fx):not([data-board^="C01"])').forEach(board => {
    if (board.querySelector('.fold') || board.offsetHeight <= 850) return;
    board.insertAdjacentHTML('beforeend', '<div class="fold" style="top:844px"><span>↓ 첫 화면 끝 · 아래는 스크롤 (헤더·하단 버튼 고정)</span></div>');
  });
}
function drawWires() {
  markScrollFold();
  const svg = document.getElementById('wires');
  svg.setAttribute('width', world.scrollWidth); svg.setAttribute('height', world.scrollHeight);
  let out = '';
  const sideLaneCount = new Map(); // 같은 세로 줄로 내려가는 화살표는 보드 왼쪽 통로를 조금씩 비켜서 지나간다
  world.querySelectorAll('#lanes [data-arrow]').forEach(el => {
    if (el.closest('.base')) return; // 흐리게 깔린 바탕 화면의 버튼은 화살표 대상이 아니다
    const sourceBoard = el.closest('.board'), target = world.querySelector(`#lanes .board[data-board="${el.dataset.go}"]`);
    if (!sourceBoard || !target || target === sourceBoard) return;
    const kind = el.dataset.arrow, color = WIRE_COLOR[kind];
    const label = (el.dataset.label || el.textContent).trim().slice(0, 16);
    // 화살표는 버튼 높이에서 보드 테두리에 붙여 시작해 화면 내용을 가리지 않게 한다
    const buttonRect = rectInWorld(el), s = rectInWorld(sourceBoard), t = rectInWorld(target), y = buttonRect.cy;
    const dash = kind === 'm' ? '' : ' stroke-dasharray="10 7"';
    const textStyle = 'font-size="17" font-weight="700" style="paint-order:stroke;stroke:#E9EBEE;stroke-width:7px"';
    const targetY = Math.min(Math.max(y, t.top + 70), t.bottom - 70);
    if (LANE_OF[sourceBoard.dataset.board] !== LANE_OF[el.dataset.go]) {
      // 다른 줄로 이어지는 버튼은 짧은 꼬리표로 목적지를 알려준다
      const x = s.right + 60;
      out += `<circle cx="${s.right}" cy="${y}" r="6" fill="${color}"/><path d="M${s.right},${y} H${x}" stroke="${color}" stroke-width="3"${dash} marker-end="url(#${WIRE_MARKER[kind]})" fill="none"/>`
        + `<text x="${x + 8}" y="${y + 6}" fill="${color}" ${textStyle}>→ ${LANE_OF[el.dataset.go]} ${el.dataset.go.split('_').slice(0, 2).join(' ')}</text>`;
      return;
    }
    if (t.left >= s.right - 4 || t.right <= s.left + 4) {
      const forward = t.left >= s.right - 4;
      const [d, lx, ly] = curvePath([forward ? s.right : s.left, y], [forward ? t.left : t.right, targetY], true);
      out += `<circle cx="${forward ? s.right : s.left}" cy="${y}" r="6" fill="${color}"/><path d="${d}" stroke="${color}" stroke-width="3"${dash} marker-end="url(#${WIRE_MARKER[kind]})" fill="none"/>`
        + `<text x="${lx}" y="${ly - 10}" text-anchor="middle" fill="${color}" ${textStyle}>${label}</text>`;
      return;
    }
    // 같은 세로 줄(위·아래 보드): 보드 왼쪽 통로로 꺾어서 잇는다
    const columnKey = Math.round(s.left), order = sideLaneCount.get(columnKey) || 0;
    sideLaneCount.set(columnKey, order + 1);
    const x = s.left - 34 - order * 22;
    out += `<circle cx="${s.left}" cy="${y}" r="6" fill="${color}"/><path d="M${s.left},${y} H${x} V${t.top + 70} H${t.left}" stroke="${color}" stroke-width="3"${dash} marker-end="url(#${WIRE_MARKER[kind]})" fill="none" stroke-linejoin="round"/>`
      + `<text x="${x - 8}" y="${(y + t.top + 70) / 2}" text-anchor="end" fill="${color}" ${textStyle}>${label}</text>`;
  });
  svg.innerHTML = out;
}

const stage = document.getElementById('stage'), zoomText = document.getElementById('zoomText');
function applyView() { world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`; zoomText.textContent = Math.round(scale * 100) + '%'; }
function zoomAt(next, px, py) { next = Math.min(1.5, Math.max(0.05, next)); panX = px - (px - panX) * (next / scale); panY = py - (py - panY) * (next / scale); scale = next; applyView(); }
function fitAll() { scale = Math.min(innerWidth / world.scrollWidth, innerHeight / world.scrollHeight) * 0.95; panX = 20; panY = 20; applyView(); }
function focusOn(selector) {
  const el = world.querySelector(selector); if (!el) return;
  const r = rectInWorld(el); scale = 0.55; panX = innerWidth / 2 - (r.left + 195) * scale; panY = 90 - r.top * scale; applyView();
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
}
stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(scale * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY); }, { passive: false });
let drag = null;
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, panX, panY, target: e.target, moved: false }; });
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) { drag.moved = true; stage.setPointerCapture(e.pointerId); stage.classList.add('dragging'); }
  if (drag.moved) { panX = drag.panX + e.clientX - drag.x; panY = drag.panY + e.clientY - drag.y; applyView(); }
});
stage.addEventListener('pointerup', () => { if (drag && !drag.moved) handleCanvasClick(drag.target); drag = null; stage.classList.remove('dragging'); });
function handleCanvasClick(target) {
  const focus = target.closest('[data-focus]'); if (focus) return focusOn(`.board[data-board="${focus.dataset.focus}"]`);
  const play = target.closest('[data-play]'); if (play) return openViewer(SCENARIOS[+play.dataset.play].steps[0], +play.dataset.play);
  const board = target.closest('.board'); if (!board) return;
  const link = target.closest('[data-go]');
  openViewer(link && !link.closest('.base') ? link.dataset.go : board.dataset.board);
}
document.getElementById('zoomIn').onclick = () => zoomAt(scale * 1.25, innerWidth / 2, innerHeight / 2);
document.getElementById('zoomOut').onclick = () => zoomAt(scale / 1.25, innerWidth / 2, innerHeight / 2);
document.getElementById('zoomFit').onclick = fitAll;
document.getElementById('goIntro').onclick = () => { scale = 0.45; panX = 30; panY = 30; applyView(); };

// ============================================================
// 8. 폰 미리보기: 어디서 눌러도 해당 화면으로 이동
// ============================================================
const viewer = document.getElementById('viewer'), phone = document.getElementById('vphone');
let visitedScreens = [], scenario = null;
function openViewer(id, scenarioIndex) {
  if (scenarioIndex !== undefined) scenario = scenarioIndex;
  visitedScreens = []; viewer.classList.add('on'); fitPhone(); showScreen(id, false);
}
function fitPhone() {
  const s = Math.min(1, (innerHeight - 50) / 844);
  phone.style.transform = `scale(${s})`;
  const hold = document.getElementById('vhold'); hold.style.width = 390 * s + 'px'; hold.style.height = 844 * s + 'px';
}
function showScreen(id, remember = true) {
  const b = BOARDS[id]; if (!b) return;
  if (remember && phone.dataset.current) visitedScreens.push(phone.dataset.current);
  phone.dataset.current = id;
  phone.innerHTML = `<div class="board ${b.fixed ? 'fx' : ''}">${b.html}</div>`; phone.scrollTop = 0;
  document.getElementById('vtitle').textContent = id;
  document.getElementById('vlane').textContent = `${LANE_OF[id] || ''} 줄 · ${(LANES.find(l => l.no === LANE_OF[id]) || {}).title || ''}`;
  // 실패·빈 상태처럼 버튼으로는 가지 않는 보드도 미리보기에서 바로 열 수 있게, 같은 세로 줄의 다른 상태를 보여준다
  const sameColumn = LANES.flatMap(l => l.cols).find(col => col.includes(id)) || [];
  const otherStates = sameColumn.filter(other => other !== id);
  document.getElementById('vmemo').innerHTML = memoHtml(b.memo)
    + (otherStates.length ? `<div style="margin-top:12px"><b>같은 화면의 다른 상태</b><br>${otherStates.map(other => `<span class="fchip" data-state="${other}">${other}</span>`).join('')}</div>` : '');
  document.getElementById('vmsg').textContent = '';
  renderScenarioSteps(id);
}
function renderScenarioSteps(currentId) {
  const box = document.getElementById('vscen');
  if (scenario === null) { box.innerHTML = ''; return; }
  const s = SCENARIOS[scenario];
  box.innerHTML = `<b>${s.name}</b><ol class="vsteps">${s.steps.map((id, i) => `<li class="${id === currentId ? 'on' : ''}" data-step="${i}">${i + 1}. ${id}</li>`).join('')}</ol>`;
}
phone.addEventListener('click', e => {
  // 카드 안의 작은 버튼(법령 원문 ↗ 등)은 카드 이동보다 먼저 처리한다
  const inPlace = e.target.closest('[data-act]');
  if (inPlace && !inPlace.closest('.base')) return showInPlaceAction(inPlace.dataset.act);
  const link = e.target.closest('[data-go]');
  if (link && !link.closest('.base')) showScreen(link.dataset.go);
});
// 화면이 바뀌지 않는 버튼은 폰 아래에 무슨 일이 일어나는지 잠깐 보여준다
function showInPlaceAction(text) {
  const hold = document.getElementById('vhold');
  hold.querySelector('.vtoast')?.remove();
  hold.insertAdjacentHTML('beforeend', `<div class="vtoast">${text}</div>`);
  setTimeout(() => hold.querySelector('.vtoast')?.remove(), 2600);
  document.getElementById('vmsg').textContent = '이 화면 안에서: ' + text;
}
document.getElementById('vmemo').addEventListener('click', e => { const chip = e.target.closest('[data-state]'); if (chip) showScreen(chip.dataset.state); });
document.getElementById('vscen').addEventListener('click', e => { const li = e.target.closest('[data-step]'); if (li) showScreen(SCENARIOS[scenario].steps[+li.dataset.step]); });
document.getElementById('vback').onclick = () => { if (visitedScreens.length) showScreen(visitedScreens.pop(), false); };
document.getElementById('vclose').onclick = () => { viewer.classList.remove('on'); scenario = null; };
document.getElementById('vcanvas').onclick = () => { const id = phone.dataset.current; viewer.classList.remove('on'); scenario = null; focusOn(`.board[data-board="${id}"]`); };
addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('vclose').click(); });
addEventListener('resize', () => { if (viewer.classList.contains('on')) fitPhone(); });

// ============================================================
// 9. 시작
// ============================================================
renderIntro();
renderLanes();
applyView();
document.fonts.ready.then(() => { drawWires(); document.getElementById('goIntro').click(); });
</script>
</body>
</html>
